<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        .pai{
            background-color: black;
            display: flex;
            flex-flow: row wrap;
            height: 700;

        }
        .filho{
            background-color: aqua;
            padding: 20px;
            flex-basis: 100px;
        
            
            border: 1px solid black;
        }
       
      
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho"  id="i1">k</div>
        <div class="filho" id="i2">b</div>
        <div class="filho" id="i3">c</div>
        <div class="filho" id="i4">d</div>
        <div class="filho" id="i5">e</div>
        <div class="filho" id="i6">f</div>
    </div>
</body>
</html>
