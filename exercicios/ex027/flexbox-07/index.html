<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        .pai{
            background-color: black;
            display: flex;
            flex-direction:row;
            align-items: flex-start;
            flex-wrap: wrap;
            height: 200px;

        }
        .filho{
            background-color: aqua;
            padding: 20px;
        
            
            border: 1px solid black;
        }
        #i1{
          align-self: center;
        }
        #i2{
           align-self: flex-end; 
        }
        #i3{
            align-self: flex-end;
        }
        #i4{
          align-self: flex-end;  
        }
        #i5{
        align-self: flex-end;  
        }
        #i6{
          align-self: auto;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho"  id="i1">a</div>
        <div class="filho" id="i2">b</div>
        <div class="filho" id="i3">c</div>
        <div class="filho" id="i4">d</div>
        <div class="filho" id="i5">e</div>
        <div class="filho" id="i6">f</div>
    </div>
</body>
</html>
